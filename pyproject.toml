[build-system]
requires = ["uv_build>=0.8.3,<1.0"]
build-backend = "uv_build"

[project]
name = "lfm"
version = "0.40.9"
description = "Similar-artist finder CLI on the Last.fm API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "platformdirs>=4.3",
    "pydantic>=2.11",
    "rich>=14.0",
    "stamina>=26.1.0",
    "textual>=8.2.8",
    "typer>=0.16",
]

[project.scripts]
lfm = "lfm.cli:app"

[dependency-groups]
dev = [
    "diff-cover>=10.6.0",
    "hypothesis>=6.168.5",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-textual-snapshot>=1.0.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.22.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.coverage.run]
branch = true
source = ["lfm"]
